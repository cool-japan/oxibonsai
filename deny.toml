# Three-way `base64` skew: `tokenizers` v0.23.2's own `spm_precompiled`
# dependency pins the old 0.13 generation, `hyper-util` (pulled by
# axum/reqwest/oxihttp-client's hyper stack) pins 0.22, and `oxihttp-client`/
# `reqwest` use the current 0.23 generation directly. All three pins are
# third-party and outside this workspace's manifests. Ignored 2026-09-21,
# revisit 2027-03-31.
[[bans.skip]]
name = "base64"
version = "<0.23"
reason = "tokenizers' spm_precompiled (0.13) + hyper-util (0.22) vs reqwest/oxihttp-client's own 0.23; see comment above. Ignored 2026-09-21, revisit 2027-03-31."

# `hashbrown` skew: `safetensors` v0.8.0 (third-party model-file format) pins
# the older 0.16 generation while the HTTP stack (`indexmap` -> `h2`),
# oxitls-webpki-roots's `lru` dependency, and `oxionnx-core` already resolve
# 0.17. Third-party pins on both sides. Ignored 2026-09-21, revisit
# 2027-03-31.
[[bans.skip]]
name = "hashbrown"
version = "<0.17"
reason = "safetensors' old pin (0.16) vs the HTTP/oxionnx stack's 0.17; see comment above. Ignored 2026-09-21, revisit 2027-03-31."

# macOS-only `core-foundation` skew: `system-configuration` (pulled by
# `hyper-util`, used by axum/reqwest/oxihttp-client for system proxy
# detection) resolves the older 0.9 generation, while the `metal` GPU crate
# (via `core-graphics-types`) and reqwest's `rustls-platform-verifier`/
# `security-framework` (macOS certificate verification) already resolve
# 0.10. Third-party pins on both sides. Ignored 2026-09-21, revisit
# 2027-03-31.
[[bans.skip]]
name = "core-foundation"
version = "<0.10"
reason = "system-configuration's old pin (0.9) vs metal/security-framework's 0.10; see comment above. Ignored 2026-09-21, revisit 2027-03-31."

# `syn` v3 arrived very early: `synstructure` v0.14.0 (pulled transitively
# through the icu4x Unicode-normalization stack used for URL/IDNA parsing)
# has already migrated to `syn` 3, while every other proc-macro dependency in
# this graph (serde_derive, thiserror-impl, tokio-macros, axum-macros,
# darling_core, asn1-rs-derive, curve25519-dalek-derive, etc.) is still on
# `syn` 2. Third-party ecosystem transition. Ignored 2026-09-21, revisit
# 2027-03-31.
[[bans.skip]]
name = "syn"
version = "<3.0.0"
reason = "synstructure's early syn-3 migration vs the rest of the proc-macro ecosystem on syn 2; see comment above. Ignored 2026-09-21, revisit 2027-03-31."

# RESTORED (B2-08, 2026-09-21): `oxibonsai-tokenizer` now depends directly on
# `fancy-regex = { workspace = true }` (0.19.2) for the qwen2/qwen35 `Split`
# pre-tokenizer (TOK-03/TOK-04), re-introducing exactly the duplication
# FIX-01-BUILD's note above predicted: `tokenizers` v0.23.2 still pins its own
# internal `fancy-regex` at 0.17.0 (verified via `cargo tree --duplicates`).
# Both are Pure Rust with no security advisories; skip rather than pin, since
# `tokenizers` does not expose a way to override its internal dependency.
[[bans.skip]]
name = "fancy-regex"
version = "<0.19"
reason = "tokenizers v0.23.2 pins its own internal fancy-regex 0.17.0, independent of oxibonsai-tokenizer's direct 0.19.2 edge (TOK-03/TOK-04, B2-08 wave 2). Restored 2026-09-21, revisit 2027-03-31."

