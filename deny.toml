# Ecosystem-wide `rand`-family major-version treadmill, independent of the
# RustCrypto skew above: three unrelated consumers each pin a different
# generation — `rsa` v0.9.10 (an oxitls-rustcrypto-provider dependency) still
# requires the 0.6-0.9 generation, this workspace's own `proptest` v1.11.0
# dev-dependency requires the 0.9 generation (no 0.10-compatible proptest
# release exists yet), and `scirs2-core` v0.6.5 (COOLJAPAN numerics, kept at
# the latest release per policy) already uses the newest 0.10 generation.
# Not fixable from this workspace alone without violating the Latest-Crates
# policy (downgrading scirs2-core) or blocking on an upstream proptest
# release. Ignored 2026-09-21, revisit 2027-03-31.
[[bans.skip]]
name = "getrandom"
version = "<0.4"
reason = "rand-family treadmill (rsa's old pin vs proptest's mid pin vs scirs2-core's newest); see comment above. Ignored 2026-09-21, revisit 2027-03-31."

[[bans.skip]]
