[package]
name = "oxibonsai-serve"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxibonsai-serve"
description = "Standalone OpenAI-compatible inference server for OxiBonsai"
categories = ["command-line-utilities", "science"]
readme = "README.md"
keywords = ["llm", "inference", "server", "openai", "bonsai"]

[[bin]]
name = "oxibonsai-serve"
path = "src/main.rs"

[features]
# Forward the GPU backend to the runtime. The engine pool auto-clamps to a
# single replica on the Metal tier (the GPU decode path is a process-global
# singleton), so this only changes the kernel backend, not the server surface.
metal = ["oxibonsai-runtime/metal"]
# Mirror of `metal` for CUDA hosts.
native-cuda = ["oxibonsai-runtime/native-cuda"]

[dependencies]
oxibonsai-core.workspace = true
# `hf-tokenizer` was requested explicitly (not inherited) so this binary's
# `TokenizerBridge::from_file` resolved a `tokenizer.json` through the HF
# backend, byte-for-byte as before FIX-01-BUILD split the bridge into
# `{ Native, Hf }`.
#
# FLIPPED OFF (BENCHES, wave 3, RT-ADMIN-CFG blocking-1 / decision D-5): see
# `crates/oxibonsai-runtime/Cargo.toml`'s matching comment for the two
# preconditions (cross-backend parity + the `is_special_id` benchmark) that
# are now satisfied, including the window-scaled figure that decision
# actually turns on (`native_step_decode` rescans the whole decode window
# per streamed token, not one call: ~41-82 us/token at a realistic
# 2048-4096 token window, still far below a token's decode cost) —
# `oxibonsai-serve`'s config-level `kind` whitelist
# (`config.rs`/`validation.rs`) never selected the backend at runtime
# anyway; the backend was always this compile-time feature. Loads through
# the Pure-Rust native backend by default now; pass `--features
# oxibonsai-runtime/hf-tokenizer` to keep the HuggingFace path.
oxibonsai-runtime = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["limit", "load-shed", "timeout", "util"] }

[dev-dependencies]
reqwest.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true
serde_json.workspace = true
oxibonsai-testkit.workspace = true
