# cargo-nextest configuration for OxiBonsai CI.
#
# See https://nexte.st/docs/configuration/ for the full reference.
#
# T-13: the previous 60s/90s slow-timeout margins were tuned against this
# dev machine (Apple M3) and left near-zero headroom for anything slower —
# a loaded CI runner, an older laptop, or a debug (unoptimized) build of the
# heavier model/kernel parity tests, all of which run measurably slower than
# release-profile SIMD on an M3. `terminate-after` is raised alongside
# `period` so the effective hang ceiling (period * terminate-after) grows
# too, not just the per-check interval.

# D-6(4): `legacy_parity_tests` (oxibonsai-model and
# oxibonsai-runtime) are no longer `#[ignore]`d and each loads one or more
# multi-GB real GGUFs from ./models — running more than one of these bodies
# concurrently would multiply peak RSS and contend for the same mmap'd
# files, and a 120s/180s default slow-timeout is far too short for a cold
# multi-GB load + full greedy decode. `real-model-gate` below pins these
# binaries to a single thread (never run alongside each other) and the
# per-profile overrides give them their own, much longer slow-timeout
# instead of inheriting the profile default.
[test-groups]
real-model-gate = { max-threads = 1 }

[profile.default]
retries = 0
fail-fast = false
# Effective hang ceiling: 120s * 3 = 360s. A test that is merely slow (not
# deadlocked) on a weaker machine should clear this; a genuine
# deadlock/livelock still gets terminated rather than hanging the run
# forever.
slow-timeout = { period = "120s", terminate-after = 3 }
# Excludes the real Bonsai 2 27B gate tests, the real Metal 27B gate tests
# and the two full-weight-load `real_27b_` lib/bin cases from every
# `cargo nextest run` that does not explicitly ask for them. Without this, a
# workspace `cargo nextest run --all-features` with `OXIBONSAI_MODELS_DIR`
# set schedules `hybrid_forward_parity_tests`'s and `bonsai2_engine_tests`'s
# real-27B cases as DEBUG builds — each maps a 5.9-7.2 GB GGUF, so a handful
# running concurrently (nextest's default parallelism, one process per test)
# can reach tens of GB resident on this 24 GB machine and takes on the order
# of hours in debug. They still run in full: `scripts/release-gate.sh`'s
# stage 1c invokes them directly in `--release`, one at a time; a developer
# who wants them through nextest locally still can, explicitly, with
# `cargo nextest run --release --ignore-default-filter -E '<the filters just
# below, combined with "or">'`. Reverse this (drop `default-filter`, or
# narrow it) if a future host/CI runner can afford running them by default.
#
# The header-only `real_27b_gguf_metadata_*` and `special_token_class_real_27b_header`
# cases (an `mmap` + metadata parse, no weight load) are deliberately NOT
# excluded here — they cost about as much as any other test and belong in a
# plain nextest run.
default-filter = 'not (binary(hybrid_forward_parity_tests) & test(/hybrid_real_27b_/)) & not (binary(bonsai2_engine_tests) & test(/_engine_greedy_matches_the_fork_goldens$/)) & not test(/hybrid_real_27b_metal_/) & not test(/real_27b_hybrid_embed_returns_a_unit_vector/) & not test(/real_27b_hybrid_model_serves_embeddings/)'

# M-08's opt-in long-context gate (`oxibonsai-runtime::legacy_parity_tests::
# m08_yarn_scaling_moves_real_bonsai_8b_logits_at_20000_tokens`) self-skips in
# well under a second unless `OXIBONSAI_M08_RUN_LONG=1`; with it set, it runs
# two real Bonsai-8B child processes of roughly an hour each, back to back —
# past the 6000s ceiling of the `binary(legacy_parity_tests)` override below.
# Listed first because nextest applies, per setting, the first override that
# matches. Ceiling 900s x 24 = 6h, the sum of the test's own two per-child
# hang guards.
[[profile.default.overrides]]
filter = 'test(/m08_yarn_scaling_moves_real_bonsai_8b_logits_at_20000_tokens/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 24 }

[[profile.default.overrides]]
filter = 'binary(legacy_parity_tests)'
test-group = 'real-model-gate'
# T-13: raised from `terminate-after = 4` (2400s ceiling) — under machine
# load a workspace nextest run hit this ceiling on
# `oxibonsai-runtime::legacy_parity_tests::
# ternary_8b_greedy_text_matches_golden_across_tiers` (1445s quiet, > 2400s
# loaded). `period` is unchanged; only the number of checks before giving up
# grows, so a genuine deadlock/livelock is still caught, just with more
# headroom for a busy shared build machine.
slow-timeout = { period = "600s", terminate-after = 10 }

# T-13: pins
# the real Bonsai 2 27B gates to the SAME `real-model-gate` group (already
# `max-threads = 1`, see `[test-groups]` above) so they never run alongside
# each other or alongside the legacy real-model gates above — one real-model
# process at a time — while every OTHER test in the same two
# binaries (the synthetic/fixture-only cases nextest's own process-per-test
# model already isolates) keeps running with full parallelism. `test(/…/)`
# is a REGEX filter (the `/…/` delimiters), not a substring match: an
# anchored `^hybrid_real_27b_` matches nothing here because
# `hybrid_forward_parity_tests.rs` pulls these tests in through `#[path]
# mod greedy_gates;` / `mod layer_gate;`, so nextest names them
# `greedy_gates::hybrid_real_27b_*` / `layer_gate::hybrid_real_27b_*` — the
# module prefix comes before the anchor point. Exact counts, verified
# against this workspace (`cargo nextest list -p oxibonsai-model -p
# oxibonsai-runtime --all-features --ignore-default-filter -E '<these two
# filters, combined with "or">'` lists exactly 5; the same command without
# `--ignore-default-filter` lists 0, per `default-filter` above):
#   - `binary(hybrid_forward_parity_tests) & test(/hybrid_real_27b_/)` = 3
#     (`greedy_gates::hybrid_real_27b_pq2_0_matches_the_fork_goldens_bonsai2`,
#     `greedy_gates::hybrid_real_27b_ptq1_0_greedy_matches_the_fork_goldens_bonsai2`,
#     `layer_gate::hybrid_real_27b_layers_match_the_f64_reference_bonsai2`);
#   - `binary(bonsai2_engine_tests) & test(/_engine_greedy_matches_the_fork_goldens$/)`
#     = 2 (`bonsai2_pq2_engine_greedy_matches_the_fork_goldens`,
#     `bonsai2_ptq1_engine_greedy_matches_the_fork_goldens`).
# `slow-timeout` here is deliberately generous (900s x 8 = 7200s): these are
# release-profile-only gates in practice (`default-filter` above keeps a
# plain nextest run from ever hitting them in debug), each mapping a
# multi-GB GGUF and decoding tens of tokens. NOTE: with `default-filter`
# active (the normal case), `cargo nextest show-config test-groups` prints
# these two override headers with no test names underneath — the tests are
# filtered out before show-config can list them. Add `--ignore-default-filter`
# to the same command to see the pinned test names themselves.
[[profile.default.overrides]]
filter = 'binary(hybrid_forward_parity_tests) & test(/hybrid_real_27b_/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(bonsai2_engine_tests) & test(/_engine_greedy_matches_the_fork_goldens$/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

# Four more real-model legs join the same one-at-a-time `real-model-gate`
# group (one real-model process at a time). None of them is `#[ignore]`d —
# each self-skips with a capability record when its model is absent, and
# `int8_native_forward_tests` / `int8_tier_parity` also find models through
# the testkit `models/` fallback when `OXIBONSAI_MODELS_DIR` is unset — so
# without these pins a workspace `cargo nextest run` maps the
# Ternary-Bonsai-1.7B and Bonsai-8B GGUFs in several concurrent debug
# processes. The 600s x 10 ceiling matches `legacy_parity_tests` above: the
# batched-hidden parity leg alone took 912-2653s in debug under load, far
# past the 360s profile default that used to terminate it.
#   - `real_model_batched_hidden_matches_sequential` (oxibonsai-model lib):
#     batched `forward_hidden` vs the sequential path on a real GGUF;
#   - `embed_bench_short_and_long` (oxibonsai-runtime): the embeddings
#     throughput bench on a real GGUF;
#   - `int8_native_forward_tests` (whole binary): the two full-forward INT8
#     tier parity legs on the real 1.7B / 8B;
#   - `int8_tier_parity`'s `*_on_the_real_*` legs (1.7B / 8B / 27B PQ2_0
#     weights) and `cross_backend_determinism_tests`'s `real_model_*` legs
#     (CPU-vs-Metal byte identity, INT8-tier decode tok/s).
[[profile.default.overrides]]
filter = 'package(oxibonsai-model) & kind(lib) & test(/real_model_batched_hidden_matches_sequential$/)'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'binary(embeddings_model_backed) & test(/embed_bench_short_and_long$/)'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'binary(int8_native_forward_tests)'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

[[profile.default.overrides]]
filter = '(binary(int8_tier_parity) & test(/_on_the_real_/)) | (binary(cross_backend_determinism_tests) & test(/^real_model_/))'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

# The real Metal 27B gates (CPU-vs-Metal token parity, decode throughput —
# oxibonsai-model's `hybrid_metal_gates`, named `hybrid_real_27b_metal_*`):
# `default-filter` above already excludes them from a plain run, but pin
# them to the same single-threaded group as every other real-27B gate for a
# developer who runs them explicitly with `--ignore-default-filter`, or on a
# future host where `default-filter` has been narrowed. Filtered by test
# name rather than `binary(hybrid_metal_gates)`: that binary does not always
# exist in every worktree this file is checked out into, and a `test(/…/)`
# name filter matches nothing (not an error) when the binary is absent,
# exactly like `default-filter`'s own equivalent exclusion above.
[[profile.default.overrides]]
filter = 'test(/hybrid_real_27b_metal_/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

# The four real-model lib/bin acceptance cases (`scripts/release-gate.sh`
# stage 1d): two on the 1.7B legacy model
# (`temperature_zero_completion_takes_the_metal_greedy_gpu_path`,
# `real_model_stream_stop_sequence_matches_the_non_stream_text_and_reports_stop`,
# both inside `oxibonsai-runtime`'s own `--lib` tests) and two on the real
# Bonsai 2 27B (`real_27b_hybrid_embed_returns_a_unit_vector` in
# `oxibonsai-runtime`'s `--lib`, `real_27b_hybrid_model_serves_embeddings` in
# `oxibonsai-cli`'s `--bin`). Only the 27B pair is excluded by
# `default-filter` above (a full weight load); all four are still pinned to
# `real-model-gate` here so an explicit `--ignore-default-filter` run never
# schedules one of them alongside another real-model case.
[[profile.default.overrides]]
filter = 'test(/temperature_zero_completion_takes_the_metal_greedy_gpu_path|real_model_stream_stop_sequence_matches_the_non_stream_text_and_reports_stop|real_27b_hybrid_embed_returns_a_unit_vector|real_27b_hybrid_model_serves_embeddings/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

# G9 (`oxibonsai info --json` on the real 27B files, one case per quant
# band, in `oxibonsai-runtime`'s `bonsai2_runtime_tests`): each case spawns
# its own `cargo build -p oxibonsai-cli --bin oxibonsai` and then dry-binds
# the mmap'd multi-GB GGUF, so two cases running concurrently would contend
# on the same cargo build lock and double the resident mapped weight data.
# Left in `default-filter` above (like `real_27b_gguf_metadata_*`) since
# each case self-skips in well under a second when its own env var is
# unset; pinned here for the case where it is set.
[[profile.default.overrides]]
filter = 'test(/real_27b_info_reports_/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

[profile.ci]
retries = 0
fail-fast = false
# CI runners are frequently shared/throttled and slower than local dev
# hardware, and this profile also covers `--all-features` runs that pull in
# the (self-skipping today, but not forever — see T-05) hardware-gated
# suites. Effective hang ceiling: 180s * 4 = 720s.
slow-timeout = { period = "180s", terminate-after = 4 }
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "flaky"
# See `[profile.default]`'s own `default-filter` comment — same exclusion,
# same reason, kept in sync by hand (nextest does not support inheriting one
# profile's `default-filter` into another).
default-filter = 'not (binary(hybrid_forward_parity_tests) & test(/hybrid_real_27b_/)) & not (binary(bonsai2_engine_tests) & test(/_engine_greedy_matches_the_fork_goldens$/)) & not test(/hybrid_real_27b_metal_/) & not test(/real_27b_hybrid_embed_returns_a_unit_vector/) & not test(/real_27b_hybrid_model_serves_embeddings/)'

# See `[profile.default]`'s own M-08 override — same filter, same reason.
[[profile.ci.overrides]]
filter = 'test(/m08_yarn_scaling_moves_real_bonsai_8b_logits_at_20000_tokens/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 24 }

[[profile.ci.overrides]]
filter = 'binary(legacy_parity_tests)'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'binary(hybrid_forward_parity_tests) & test(/hybrid_real_27b_/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

[[profile.ci.overrides]]
filter = 'binary(bonsai2_engine_tests) & test(/_engine_greedy_matches_the_fork_goldens$/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

# Same four real-model pins as `[profile.default]` above (see the comment
# there); kept in sync by hand like `default-filter`.
[[profile.ci.overrides]]
filter = 'package(oxibonsai-model) & kind(lib) & test(/real_model_batched_hidden_matches_sequential$/)'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'binary(embeddings_model_backed) & test(/embed_bench_short_and_long$/)'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'binary(int8_native_forward_tests)'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = '(binary(int8_tier_parity) & test(/_on_the_real_/)) | (binary(cross_backend_determinism_tests) & test(/^real_model_/))'
test-group = 'real-model-gate'
slow-timeout = { period = "600s", terminate-after = 10 }

# See `[profile.default]`'s own two matching overrides just above the
# `[profile.ci]` header — same filters, same reason, kept in sync by hand.
[[profile.ci.overrides]]
filter = 'test(/hybrid_real_27b_metal_/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

[[profile.ci.overrides]]
filter = 'test(/temperature_zero_completion_takes_the_metal_greedy_gpu_path|real_model_stream_stop_sequence_matches_the_non_stream_text_and_reports_stop|real_27b_hybrid_embed_returns_a_unit_vector|real_27b_hybrid_model_serves_embeddings/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

# See `[profile.default]`'s own matching G9 override just above the
# `[profile.ci]` header — same filter, same reason, kept in sync by hand.
[[profile.ci.overrides]]
filter = 'test(/real_27b_info_reports_/)'
test-group = 'real-model-gate'
slow-timeout = { period = "900s", terminate-after = 8 }

[profile.fast]
# For the inner dev loop: run a narrow `-E` filter while iterating on one
# module and get feedback (including a stuck test) as quickly as possible.
# Not used by scripts/ci.sh or scripts/release-gate.sh — those always use
# `default`/`ci` so a real hang cannot be masked by a short fast-profile
# timeout in the gate that is supposed to catch it.
retries = 0
fail-fast = true
slow-timeout = { period = "20s", terminate-after = 2 }
failure-output = "immediate"
success-output = "never"
status-level = "fail"
