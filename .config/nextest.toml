# cargo-nextest configuration for OxiBonsai CI.
#
# See https://nexte.st/docs/configuration/ for the full reference.

[profile.default]
retries = 0
fail-fast = false
# Most unit/integration tests finish in well under this; the CUDA-gated
# tests self-skip immediately when no GPU is present (see
# .github/workflows/ci.yml), so a hang here means a genuine deadlock/livelock
# rather than expected long-running work.
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 2 }
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "flaky"
